# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:

# Grant necessary permissions for OIDC tokens and deployment
permissions:
  contents: read
  id-token: write   # <-- This fixes the missing ACTIONS_ID_TOKEN_REQUEST_URL error

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  greet:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a single command using the runners shell
    - name: Login to Octopus Deploy
      # You may pin to the exact commit or the version.
      # uses: OctopusDeploy/login@37c884ed5aeebec1e9bb35f0e860ae43cb946772
      uses: OctopusDeploy/login@v1.0.1
      with:
        # The URL of the Octopus Instance (e.g. "https://octopus.example.com/").
        server: https://cadets.testoctopus.app/
        # The id of the service account when using OpenID Connect to login. It is strongly recommended that this value retrieved from a GitHub secret.
        service_account_id: cb4369f3-75bc-468d-abc7-3d09d858da16
    - name: Run Runbook in Octopus Deploy
      # You may pin to the exact commit or the version.
      # uses: OctopusDeploy/run-runbook-action@c35c25d435fae32d3b77484ca49352e815adf8d3
      uses: OctopusDeploy/run-runbook-action@v3.0.3
      with:
        # The name of the project associated with this runbook.
        project: runbooks
        # The name of the runbook.
        runbook: asdf
        # A multi-line list of environments to deploy to.
        environments: Development
        # The instance URL hosting Octopus Deploy (i.e. "https://octopus.example.com/"). The instance URL is required, but you may also use the OCTOPUS_URL environment variable.
        server: https://cadets.testoctopus.app
        # The name of a space within which this command will be executed. The space name is required, but you may also use the OCTOPUS_SPACE environment variable.
        space: Ben
    
