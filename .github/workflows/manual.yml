# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:

# Grant necessary permissions for OIDC tokens and deployment
permissions:
  contents: read
  id-token: write   # <-- This fixes the missing ACTIONS_ID_TOKEN_REQUEST_URL error

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  greet:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Login to Octopus Deploy
      uses: OctopusDeploy/login@v1.0.1
      with:
        server: https://cadets.testoctopus.app/
        service_account_id: cb4369f3-75bc-468d-abc7-3d09d858da16
    - name: Run Runbook in Octopus Deploy
      uses: OctopusDeploy/run-runbook-action@v3.0.3
      with:
        project: runbooks
        runbook: asdf
        environments: Development
        space: Ben
    
